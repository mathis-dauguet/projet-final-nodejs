name: Testing and building

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          target: production
          tags: api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runs as non-root
        run: test "$(docker run --rm api:ci id -u)" != "0"

      - name: Ships no TypeScript sources
        run: test -z "$(docker run --rm api:ci find /app -name '*.ts' -not -path '*/node_modules/*')"
